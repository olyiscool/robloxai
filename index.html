<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Roblox-Style Obby with Sound</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <div id="ui">
    <div>Use WASD or Arrow Keys to Move</div>
    <div>Press SPACE to Jump</div>
    <div id="status" style="margin-top: 10px; color: #ffcc00;">Click screen to start audio...</div>
  </div>

  <script>
    // --- 1. AUDIO SETUP ---
    const jumpSound = new Audio('jump.mp3');
    const walkSound = new Audio('walk.mp3');
    walkSound.loop = true;
    
    // Lower volume slightly so it isn't overpowering
    jumpSound.volume = 0.5;
    walkSound.volume = 0.4;

    // Enable audio context on first click (browsers block auto-playing audio)
    window.addEventListener('click', () => {
      if (document.getElementById('status').innerText.includes('Click screen')) {
        document.getElementById('status').innerText = 'Audio Ready!';
        document.getElementById('status').style.color = '#00ff00';
      }
    }, { once: true });

    // --- 2. SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x68b0d8);
    scene.fog = new THREE.FogExp2(0x68b0d8, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // --- 3. GAME STATE & VARIABLES ---
    let playerLoaded = false;
    const velocity = new THREE.Vector3();
    const speed = 12;
    const gravity = 35;
    const jumpStrength = 15;
    let canJump = false;

    const keys = {};
    const platforms = [];

    // --- 4. CREATE OBBY PLATFORMS ---
    function createPlatform(x, y, z, w, h, d, color = 0x3388ff, isKillBrick = false) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.1 });
      const platform = new THREE.Mesh(geo, mat);
      platform.position.set(x, y, z);
      platform.receiveShadow = true;
      platform.castShadow = true;
      platform.userData = { isKillBrick, w, h, d };
      scene.add(platform);
      platforms.push(platform);
      return platform;
    }

    const spawnPoint = new THREE.Vector3(0, 3, 0);
    createPlatform(0, 0, 0, 10, 2, 10, 0x33aa33);
    createPlatform(0, 0, -12, 6, 2, 6, 0x3388ff);
    createPlatform(0, 0, -22, 6, 2, 6, 0x3388ff);
    createPlatform(0, 0, -32, 12, 2, 4, 0xff2222, true);
    createPlatform(0, 0, -42, 6, 2, 6, 0x3388ff);
    createPlatform(0, 2, -54, 10, 2, 10, 0xffaa00);

    // --- 5. PLAYER & MTL/OBJ LOADING ---
    const playerGroup = new THREE.Group();
    playerGroup.position.copy(spawnPoint);
    scene.add(playerGroup);

    const fallbackGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0xc80000 });
    const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
    fallbackMesh.position.y = 1.5;
    playerGroup.add(fallbackMesh);

    const mtlLoader = new THREE.MTLLoader();
    mtlLoader.load('ollie_gamer135.mtl', function (materials) {
      materials.preload();

      const objLoader = new THREE.OBJLoader();
      objLoader.setMaterials(materials);

      objLoader.load('ollie_gamer135.obj', function (obj) {
        playerGroup.remove(fallbackMesh);

        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        obj.position.x = -center.x;
        obj.position.z = -center.z;
        obj.position.y = -box.min.y;

        const scaleFactor = 3 / Math.max(size.y, 1);
        const modelContainer = new THREE.Group();
        modelContainer.add(obj);
        modelContainer.scale.set(scaleFactor, scaleFactor, scaleFactor);

        obj.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        playerGroup.add(modelContainer);
        playerLoaded = true;
      });
    });

    // --- 6. CONTROLS ---
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function respawn() {
      playerGroup.position.copy(spawnPoint);
      velocity.set(0, 0, 0);
      walkSound.pause();
    }

    // --- 7. GAME LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      const moveVector = new THREE.Vector3(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp']) moveVector.z -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveVector.z += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveVector.x -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveVector.x += 1;

      const isMoving = moveVector.lengthSq() > 0;

      if (isMoving) {
        moveVector.normalize();
        const angle = Math.atan2(moveVector.x, moveVector.z);
        playerGroup.rotation.y = angle;
      }

      velocity.x = moveVector.x * speed;
      velocity.z = moveVector.z * speed;

      // Jump Execution & Sound
      if (keys['Space'] && canJump) {
        velocity.y = jumpStrength;
        canJump = false;
        
        // Play jump sound
        jumpSound.currentTime = 0;
        jumpSound.play().catch(() => {});
      }

      velocity.y -= gravity * delta;

      playerGroup.position.x += velocity.x * delta;
      playerGroup.position.y += velocity.y * delta;
      playerGroup.position.z += velocity.z * delta;

      const playerRadius = 0.8;
      canJump = false;

      // Collision Detection
      platforms.forEach((plat) => {
        const pPos = plat.position;
        const halfW = plat.userData.w / 2;
        const halfH = plat.userData.h / 2;
        const halfD = plat.userData.d / 2;

        if (
          playerGroup.position.x + playerRadius > pPos.x - halfW &&
          playerGroup.position.x - playerRadius < pPos.x + halfW &&
          playerGroup.position.z + playerRadius > pPos.z - halfD &&
          playerGroup.position.z - playerRadius < pPos.z + halfD
        ) {
          const platformTop = pPos.y + halfH;
          if (
            playerGroup.position.y <= platformTop + 0.1 &&
            playerGroup.position.y >= platformTop - 0.8 &&
            velocity.y <= 0
          ) {
            if (plat.userData.isKillBrick) {
              respawn();
            } else {
              playerGroup.position.y = platformTop;
              velocity.y = 0;
              canJump = true;
            }
          }
        }
      });

      // Walking Sound Trigger (only play when on ground and moving)
      if (isMoving && canJump) {
        if (walkSound.paused) {
          walkSound.play().catch(() => {});
        }
      } else {
        if (!walkSound.paused) {
          walkSound.pause();
        }
      }

      if (playerGroup.position.y < -15) respawn();

      const cameraOffset = new THREE.Vector3(0, 6, 12);
      camera.position.copy(playerGroup.position).add(cameraOffset);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
