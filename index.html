<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Roblox-Style Obby</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      user-select: none;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }

    /* Pause Menu Overlay */
    #pause-menu {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .menu-card {
      background: #232527;
      padding: 30px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #393b3d;
    }

    .menu-card h1 {
      margin-top: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .btn {
      display: block;
      width: 200px;
      padding: 12px 20px;
      margin: 15px auto;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #00a2ff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #0088cc;
      transform: scale(1.03);
    }

    .btn-danger {
      background: #ff3b30;
    }

    .btn-danger:hover {
      background: #d62a20;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <div id="ui">
    <div>WASD / Arrows to Move | SPACE to Jump</div>
    <div>Press ESC for Menu</div>
    <div id="status" style="margin-top: 8px; color: #ffcc00;">Click screen to enable audio...</div>
  </div>

  <!-- Pause Menu -->
  <div id="pause-menu">
    <div class="menu-card">
      <h1>GAME PAUSED</h1>
      <button class="btn" onclick="toggleMenu()">Resume</button>
      <button class="btn btn-danger" onclick="respawn(); toggleMenu();">Reset Character</button>
    </div>
  </div>

  <script>
    // --- 1. AUDIO SETUP ---
    const jumpSound = new Audio('jump.mp3');
    const walkSound = new Audio('walk.mp3');
    walkSound.loop = true;
    jumpSound.volume = 0.5;
    walkSound.volume = 0.4;

    let audioUnlocked = false;
    window.addEventListener('click', unlockAudio);
    window.addEventListener('keydown', unlockAudio);

    function unlockAudio() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        document.getElementById('status').innerText = 'Audio Active!';
        document.getElementById('status').style.color = '#00ff00';
      }
    }

    // --- 2. SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x68b0d8);
    scene.fog = new THREE.FogExp2(0x68b0d8, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // --- 3. GAME STATE & MENU ---
    let isPaused = false;
    let playerLoaded = false;
    const velocity = new THREE.Vector3();
    const speed = 12;
    const gravity = 35;
    const jumpStrength = 15;
    let canJump = false;

    const keys = {};
    const platforms = [];

    function toggleMenu() {
      isPaused = !isPaused;
      document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
      if (isPaused && !walkSound.paused) {
        walkSound.pause();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        toggleMenu();
      }
      keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- 4. OBBY PLATFORMS ---
    function createPlatform(x, y, z, w, h, d, color = 0x3388ff, isKillBrick = false) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.1 });
      const platform = new THREE.Mesh(geo, mat);
      platform.position.set(x, y, z);
      platform.receiveShadow = true;
      platform.castShadow = true;
      platform.userData = { isKillBrick, w, h, d };
      scene.add(platform);
      platforms.push(platform);
      return platform;
    }

    const spawnPoint = new THREE.Vector3(0, 3, 0);
    createPlatform(0, 0, 0, 10, 2, 10, 0x33aa33);
    createPlatform(0, 0, -12, 6, 2, 6, 0x3388ff);
    createPlatform(0, 0, -22, 6, 2, 6, 0x3388ff);
    createPlatform(0, 0, -32, 12, 2, 4, 0xff2222, true);
    createPlatform(0, 0, -42, 6, 2, 6, 0x3388ff);
    createPlatform(0, 2, -54, 10, 2, 10, 0xffaa00);

   // --- 5. PLAYER & MODEL LOADING FIXES ---
    const playerGroup = new THREE.Group();
    playerGroup.position.copy(spawnPoint);
    scene.add(playerGroup);

    // Inner container for scaling and animations
    const modelContainer = new THREE.Group();
    playerGroup.add(modelContainer);

    // Red Fallback Box
    const fallbackGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0xc80000 });
    const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
    fallbackMesh.position.y = 1.5;
    playerGroup.add(fallbackMesh);

    const mtlLoader = new THREE.MTLLoader();
    mtlLoader.load('ollie_gamer135.mtl', function (materials) {
      materials.preload();

      for (const materialName in materials.materials) {
        const mat = materials.materials[materialName];
        mat.transparent = false;
        mat.opacity = 1.0;
        mat.side = THREE.DoubleSide;
        mat.depthWrite = true;
      }

      const objLoader = new THREE.OBJLoader();
      objLoader.setMaterials(materials);

      objLoader.load('ollie_gamer135.obj', function (obj) {
        playerGroup.remove(fallbackMesh);

        // Enable shadows and opacity on all sub-meshes
        obj.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.transparent = false;
              child.material.opacity = 1.0;
              child.material.side = THREE.DoubleSide;
            }
          }
        });

        // 1. Calculate overall box boundaries
        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        // 2. Center X and Z, align bottom Y to 0 (feet on floor)
        obj.position.x = -center.x;
        obj.position.z = -center.z;
        obj.position.y = -box.min.y;

        // 3. Scale container uniformly to ~3 units tall
        const targetHeight = 3;
        const scaleFactor = targetHeight / (size.y || 1);
        modelContainer.scale.set(scaleFactor, scaleFactor, scaleFactor);

        // Turn character around to face forward
        modelContainer.rotation.y = Math.PI;

        modelContainer.add(obj);
        playerLoaded = true;
      });
    });
    
    // --- 6. RESPAWN & CONTROLS ---
    function respawn() {
      playerGroup.position.copy(spawnPoint);
      velocity.set(0, 0, 0);
      modelContainer.rotation.set(0, 0, 0);
      if (!walkSound.paused) walkSound.pause();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. MAIN GAME LOOP WITH ANIMATION ---
    const clock = new THREE.Clock();
    let walkAnimTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      if (isPaused) return;

      const delta = Math.min(clock.getDelta(), 0.1);

      const moveVector = new THREE.Vector3(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp']) moveVector.z -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveVector.z += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveVector.x -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveVector.x += 1;

      const isMoving = moveVector.lengthSq() > 0;

      // Face direction of movement
      if (isMoving) {
        moveVector.normalize();
        const targetAngle = Math.atan2(moveVector.x, moveVector.z);
        playerGroup.rotation.y = targetAngle;
      }

      velocity.x = moveVector.x * speed;
      velocity.z = moveVector.z * speed;

      // Jump Execution
      if (keys['Space'] && canJump) {
        velocity.y = jumpStrength;
        canJump = false;

        if (audioUnlocked) {
          jumpSound.currentTime = 0;
          jumpSound.play().catch(() => {});
        }
      }

      velocity.y -= gravity * delta;

      playerGroup.position.x += velocity.x * delta;
      playerGroup.position.y += velocity.y * delta;
      playerGroup.position.z += velocity.z * delta;

      const playerRadius = 0.8;
      canJump = false;

      // Platform Collisions
      platforms.forEach((plat) => {
        const pPos = plat.position;
        const halfW = plat.userData.w / 2;
        const halfH = plat.userData.h / 2;
        const halfD = plat.userData.d / 2;

        if (
          playerGroup.position.x + playerRadius > pPos.x - halfW &&
          playerGroup.position.x - playerRadius < pPos.x + halfW &&
          playerGroup.position.z + playerRadius > pPos.z - halfD &&
          playerGroup.position.z - playerRadius < pPos.z + halfD
        ) {
          const platformTop = pPos.y + halfH;
          if (
            playerGroup.position.y <= platformTop + 0.1 &&
            playerGroup.position.y >= platformTop - 0.8 &&
            velocity.y <= 0
          ) {
            if (plat.userData.isKillBrick) {
              respawn();
            } else {
              playerGroup.position.y = platformTop;
              velocity.y = 0;
              canJump = true;
            }
          }
        }
      });

      // --- PROCEDURAL ANIMATIONS (Bobbing, Tilting, Jump Bounce) ---
      if (playerLoaded) {
        if (canJump) {
          if (isMoving) {
            // Walking tilt & waddle animation
            walkAnimTime += delta * 14;
            modelContainer.rotation.z = Math.sin(walkAnimTime) * 0.08;
            modelContainer.rotation.x = 0.05; // slight forward lean
            modelContainer.position.y = Math.abs(Math.sin(walkAnimTime * 2)) * 0.15;
          } else {
            // Idle state
            modelContainer.rotation.set(0, 0, 0);
            modelContainer.position.y = 0;
          }
        } else {
          // In-air jump pose (tilts back slightly while rising/falling)
          modelContainer.rotation.x = -0.15;
          modelContainer.rotation.z = 0;
          modelContainer.position.y = 0;
        }
      }

      // Walking Sound Loop Control
      if (isMoving && canJump && audioUnlocked) {
        if (walkSound.paused) {
          walkSound.play().catch(() => {});
        }
      } else {
        if (!walkSound.paused) {
          walkSound.pause();
        }
      }

      // Respawn on Fall
      if (playerGroup.position.y < -15) respawn();

      // Camera Follow
      const cameraOffset = new THREE.Vector3(0, 6, 12);
      camera.position.copy(playerGroup.position).add(cameraOffset);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
